name: release-plz

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  release-pr:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: MarcoIeni/release-plz-action@d22c02a7cf6d7870bd163be7c7d9518d331aef34 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs when a release PR lands on main: tags vX.Y.Z, then starts release.yml.
  # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so the
  # release workflow is dispatched explicitly (workflow_dispatch is exempt).
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - id: release-plz
        uses: MarcoIeni/release-plz-action@d22c02a7cf6d7870bd163be7c7d9518d331aef34 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the release workflow for new tags
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          for tag in $(echo "$RELEASES" | jq -r '.[].tag'); do
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          done
