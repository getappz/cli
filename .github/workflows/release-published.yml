name: release-published

# Runs when a draft release is published (publishing creates the tag). The
# draft itself is built by release.yml; everything here reads the published
# assets, so nothing depends on the build run.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hashes:
    name: Hash release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.h.outputs.hashes }} # base64 sha256sum of the binaries, consumed by provenance
    steps:
      - name: Download and hash published assets
        id: h
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern '*.zip'
          sha256sum * > ../subjects.txt
          echo "hashes=$(base64 -w0 < ../subjects.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: hashes
    permissions:
      actions: read   # generator reads the workflow run for provenance
      id-token: write # OIDC keyless signing (same trust model as cosign)
      contents: write # attach the attestation to the release
    # This generator MUST be referenced by a plain @vX.Y.Z tag, not a commit
    # SHA -- its internal "fetch the builder" step derives the trusted
    # builder release from the caller's own ref and fails with "Invalid ref"
    # if that ref isn't refs/tags/vX.Y.Z. See "Referencing the SLSA generator"
    # in https://github.com/slsa-framework/slsa-github-generator/blob/main/internal/builders/generic/README.md
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] tag ref is required here, not a hash -- see comment above
    with:
      base64-subjects: ${{ needs.hashes.outputs.hashes }}
      upload-assets: true

  update-homebrew:
    name: Update Homebrew
    needs: hashes
    runs-on: ubuntu-latest
    # No-op until HOMEBREW_TOKEN is configured (repo secret) and the
    # getappz/homebrew-appz tap repo exists — set both to enable this channel.
    if: vars.HOMEBREW_TAP_ENABLED == 'true' && !github.event.release.prerelease
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download checksums and extract platform hashes
        id: checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          gh release download "${GITHUB_REF_NAME}" \
            --repo getappz/cli --pattern "SHA256SUMS.txt" --dir .

          AARCH64_DARWIN=$(grep "aarch64-apple-darwin" SHA256SUMS.txt | awk '{print $1}')
          X86_64_DARWIN=$(grep "x86_64-apple-darwin" SHA256SUMS.txt | awk '{print $1}')
          AARCH64_LINUX_GNU=$(grep "aarch64-unknown-linux-gnu" SHA256SUMS.txt | awk '{print $1}')
          X86_64_LINUX_GNU=$(grep "x86_64-unknown-linux-gnu" SHA256SUMS.txt | awk '{print $1}')

          echo "aarch64_darwin_sha=${AARCH64_DARWIN}" >> "$GITHUB_OUTPUT"
          echo "x86_64_darwin_sha=${X86_64_DARWIN}" >> "$GITHUB_OUTPUT"
          echo "aarch64_linux_sha=${AARCH64_LINUX_GNU}" >> "$GITHUB_OUTPUT"
          echo "x86_64_linux_sha=${X86_64_LINUX_GNU}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clone and generate formula
        run: |
          VERSION="${{ steps.checksums.outputs.version }}"
          AARCH64_DARWIN_SHA="${{ steps.checksums.outputs.aarch64_darwin_sha }}"
          X86_64_DARWIN_SHA="${{ steps.checksums.outputs.x86_64_darwin_sha }}"
          AARCH64_LINUX_SHA="${{ steps.checksums.outputs.aarch64_linux_sha }}"
          X86_64_LINUX_SHA="${{ steps.checksums.outputs.x86_64_linux_sha }}"
          DESC=$(grep -m1 '^description = ' crates/appz/Cargo.toml | cut -d'"' -f2)

          git clone "https://x-access-token:${HOMEBREW_TOKEN}@github.com/getappz/homebrew-appz.git"
          cd homebrew-appz
          mkdir -p Formula

          cat > Formula/appz.rb <<EOF
          class Appz < Formula
            desc "${DESC}"
            homepage "https://github.com/getappz/cli"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/getappz/cli/releases/download/v${VERSION}/appz-aarch64-apple-darwin.tar.gz"
                sha256 "${AARCH64_DARWIN_SHA}"
              else
                url "https://github.com/getappz/cli/releases/download/v${VERSION}/appz-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_64_DARWIN_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/getappz/cli/releases/download/v${VERSION}/appz-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${AARCH64_LINUX_SHA}"
              else
                url "https://github.com/getappz/cli/releases/download/v${VERSION}/appz-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_64_LINUX_SHA}"
              end
            end

            def install
              bin.install "appz"
            end

            test do
              assert_match "appz ${VERSION}", shell_output("#{bin}/appz --version")
            end
          end
          EOF
          sed -i 's/^          //' Formula/appz.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/appz.rb
          git diff --cached --quiet || git commit -m "appz ${VERSION}"
          git push
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}

  update-scoop:
    name: Update Scoop
    needs: hashes
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          # Owner PAT: main requires an approved PR + passing required
          # checks (enforce_admins is on, so no push — including an admin's
          # — bypasses that). GITHUB_TOKEN-authored branch pushes/PRs don't
          # trigger required CI checks, so this job needs a real user PAT to
          # open a mergeable PR below rather than pushing directly.
          token: ${{ secrets.CLA_SIGNATURES_TOKEN }}

      - name: Download checksums and extract windows hash
        id: checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          gh release download "${GITHUB_REF_NAME}" \
            --repo getappz/cli --pattern "SHA256SUMS.txt" --dir .

          WINDOWS_SHA=$(grep "x86_64-pc-windows-msvc" SHA256SUMS.txt | awk '{print $1}')
          echo "windows_sha=${WINDOWS_SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate manifest and open PR
        run: |
          VERSION="${{ steps.checksums.outputs.version }}"
          WINDOWS_SHA="${{ steps.checksums.outputs.windows_sha }}"
          DESC=$(grep -m1 '^description = ' crates/appz/Cargo.toml | cut -d'"' -f2)

          mkdir -p bucket

          cat > bucket/appz.json <<EOF
          {
            "version": "${VERSION}",
            "description": "${DESC}",
            "homepage": "https://github.com/getappz/cli",
            "license": "Apache-2.0",
            "url": "https://github.com/getappz/cli/releases/download/v${VERSION}/appz-x86_64-pc-windows-msvc.zip",
            "hash": "sha256:${WINDOWS_SHA}",
            "bin": "appz.exe",
            "checkver": "github",
            "autoupdate": {
              "url": "https://github.com/getappz/cli/releases/download/v\$version/appz-x86_64-pc-windows-msvc.zip"
            }
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/appz.json
          if git diff --cached --quiet; then
            echo "no manifest changes, skipping PR"
            exit 0
          fi

          BRANCH="scoop-manifest-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "scoop manifest: appz ${VERSION}"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "scoop manifest: appz ${VERSION}" \
            --body "Automated Scoop manifest update for release ${GITHUB_REF_NAME}."
          gh pr merge "$BRANCH" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}

  trigger-npm-publish:
    name: Trigger npm publish
    needs: hashes
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run
    # No-op until NPM_TOKEN is configured — set the repo secret to enable.
    if: vars.NPM_PUBLISH_ENABLED == 'true' && !github.event.release.prerelease
    steps:
      - name: Dispatch npm-publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run npm-publish.yml \
            --repo getappz/cli \
            -f version="${GITHUB_REF_NAME}"

  # PPA/Launchpad disabled for now: the curl install already covers Linux,
  # and Launchpad + GPG key custody isn't worth the setup cost without an
  # actual `apt install appz` request from users. ppa-publish.yml still
  # exists and can be dispatched manually if that changes; re-add a
  # trigger-ppa-publish job here (see git history) to re-automate it.

  trigger-docker-publish:
    name: Trigger Docker publish
    needs: hashes
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run
    steps:
      - name: Dispatch docker workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run docker.yml \
            --repo getappz/cli
