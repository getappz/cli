name: release

# Every push to the `release` branch builds the binaries and creates or
# updates a DRAFT GitHub Release v<version>. Publishing the draft creates the
# tag and fires release-published.yml (provenance, Homebrew, Scoop, npm,
# Docker). See docs/releasing.md.
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Override the Cargo.toml version for this run (e.g. 0.3.1-rc.1)"
        required: false
        type: string

# Least privilege: read-only token by default, elevated per job below.
permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Resolve version
        id: v
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          v="${OVERRIDE#v}"
          [ -n "$v" ] || v=$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{ matrix.os }}
    env:
      APPZ_BUILD_SHA: ${{ github.sha }} # reported by `appz --version`
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Apply version override
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: sed -i -E '/^\[workspace\.package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 # zizmor: ignore[cache-poisoning] save-if already gates writes to main
        with:
          key: ${{ matrix.target }}

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p appz

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p appz

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../appz-${{ matrix.target }}.tar.gz appz
          cd -

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/appz.exe -DestinationPath appz-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appz-${{ matrix.target }}
          path: appz-${{ matrix.target }}.*

  draft:
    name: Draft release
    needs: [meta, build]
    # Only the release branch publishes; any other branch is a dry run that
    # stops after the build matrix.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    environment: release # branch rule on this environment gates signing + drafting
    permissions:
      contents: write # creates the draft release and uploads assets
      id-token: write # cosign keyless signing via GitHub OIDC
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create source tarball
        # Feeds the AUR PKGBUILD (aur/appz/PKGBUILD), which builds from source.
        run: git archive --format=tar.gz --prefix="appz-${VERSION}/" "$GITHUB_SHA" -o "dist/appz-${VERSION}-source.tar.gz"

      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binaries with cosign (keyless)
        # Certificate bound to this workflow's identity, recorded in Rekor.
        run: |
          cd dist
          for file in *.tar.gz *.zip; do
            [ -e "$file" ] || continue
            echo "Signing $file..."
            cosign sign-blob --yes --bundle "${file}.cosign.bundle" "$file"
          done

      - name: Create or update draft release
        run: |
          tag="v${VERSION}"
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/isdraft 2>/dev/null; then
            if [ "$(cat /tmp/isdraft)" != "true" ]; then
              echo "::error::$tag is already published; bump the version first"
              exit 1
            fi
            gh release edit "$tag" --target "$GITHUB_SHA" "${flags[@]}"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --generate-notes "${flags[@]}"
          fi
          gh release upload "$tag" dist/* --clobber
