[package]
name = "appz-deploy"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Unified deploy front-end: drives each hosting platform's own CLI (Vercel, Netlify, ...)."
license = "Apache-2.0"
publish = false

[dependencies]
command = { path = "../command" }
appz-core = { path = "../appz-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
