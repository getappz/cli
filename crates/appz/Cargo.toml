[package]
name = "appz"
version.workspace = true
edition = "2024"
rust-version = "1.91"
description = "Detect toolchains, wire up mise, and run install/build/dev/test/lint/format/doctor for any project."
license = "Apache-2.0"
repository = "https://github.com/getappz/cli"
publish = false

[[bin]]
name = "appz"
path = "src/main.rs"

[dependencies]
cap-fs-ext = "4"
cap-std = "4"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5"
console = "0.16"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
appz-core = { path = "../appz-core" }
appz-deploy = { path = "../appz-deploy" }
appz-serve = { path = "../appz-serve" }
appz-vault = { path = "../appz-vault" }
command = { path = "../command" }
rmcp = { version = "2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
chrono = "0.4"
dirs = "6"
filetime = "0.2"
flate2 = "1"
semver = "1"
sha2 = "0.11"
rand = "0.8"
tar = "0.4"
ureq = { version = "2", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
skill = { version = "0.8.3", default-features = false, features = ["network"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
