[package]
name = "appz"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Detect toolchains, wire up mise, and run install/build/dev/test/lint/format/doctor for any project."
license = "Apache-2.0"
repository = "https://github.com/getappz/cli"
publish = false

[[bin]]
name = "appz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cliclack = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
appz-core = { path = "../appz-core" }
appz-deploy = { path = "../appz-deploy" }
rmcp = { version = "2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std"] }
