[graph]
targets = []
all-features = true

[advisories]
# cargo-deny >= 0.19 removed `vulnerability` and `notice` config knobs:
# all vulnerability/notice advisories now emit errors unless explicitly ignored.
# `unmaintained`/`unsound` now control which dependencies can fail the check.
unmaintained = "workspace"
yanked = "warn"
unused-ignored-advisory = "warn"
ignore = [
    "RUSTSEC-2026-0457", # rmcp: OAuth client SSRF (unused; appz uses stdio transport)
    "RUSTSEC-2026-0462", # rmcp: Unbounded body buffering (unused; appz uses stdio transport)
    "RUSTSEC-2026-0543", # chrono unmaintained; no drop-in upgrade yet (time/jiff migration tracked separately)
